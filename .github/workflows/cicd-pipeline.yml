name: CI-CD Automated Workflow

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # 🐳 Khởi chạy một container SQL Server thật trên hệ thống ảo của GitHub
      - name: Start Microsoft SQL Server
        run: |
          docker run -e "ACCEPT_EULA=Y" -e "MSSQL_SA_PASSWORD=YourStrong@Password123" \
            -p 1433:1433 --name sqlserver -d mcr.microsoft.com/mssql/server:2022-latest
          echo "Đang khởi tạo SQL Server Container..."
          sleep 15 # Chờ 15 giây để cơ sở dữ liệu lên nguồn hoàn toàn

      - name: Restore Dependencies
        run: dotnet restore HomeDecorShop/HomeDecorShop.sln

      - name: Build Solution
        run: dotnet build HomeDecorShop/HomeDecorShop.sln --configuration Release --no-restore

      - name: Test (.NET Unit/Integration Test)
        run: dotnet test HomeDecorShop/HomeDecorShop.sln --configuration Release --no-build
        continue-on-error: true

      # 🚀 KHỞI CHẠY SERVER API THẬT (Chế độ Development để tự động Migration DB)
      - name: Start .NET Web API Server
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__DefaultConnection: "Server=localhost,1433;Database=ShopdecorBeeDB;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;"
        run: |
          dotnet run --project HomeDecorShop/HomeDecorShop.API/HomeDecorShop.API.csproj --configuration Release --urls "http://localhost:5000" &
          echo "Đang khởi động Server .NET API tại cổng 5000..."
          sleep 15 # Chờ 15 giây để Server ổn định hệ thống trước khi Newman bắn Test

      - name: Setup Node for Newman
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman CLI
        run: npm install -g newman

      # 🎯 BẮN KIỂM THỬ TỰ ĐỘNG (Xuất dữ liệu lỗi ra file report.json)
      - name: Run Postman Automation Test
        id: newman_test
        run: |
          echo "Hệ thống Newman bắt đầu thực hiện quét toàn bộ các API..."
          newman run postman/ShopdecorBee-7-Services.postman_collection.json \
            --env-var "baseUrl=http://localhost:5000" \
            -r json --reporter-json-export report.json
        continue-on-error: true

      # 🔍 ĐỌC FILE REPORT ĐỂ TRÍCH XUẤT TÊN SERVICE BỊ LỖI
      # Sửa đổi quan trọng: Thay always() thành khóa kép failure() để KIỂM SOÁT logic chặt chẽ
      - name: Extract Failed Service Name
        id: get_failed_service
        if: ${{ failure() && steps.newman_test.outcome == 'failure' }}
        run: |
          FAILED_SERVICE=$(node -e "
            try {
              const report = require('./report.json');
              const failures = report.run.failures;
              if (failures && failures.length > 0) {
                // Nhặt chính xác tên của Request bị đổ bể đầu tiên
                console.log(failures[0].source.name);
              } else {
                console.log('Unknown Service');
              }
            } catch(e) {
              console.log('Error parsing report');
            }
          ")
          echo "Tên Service bị lỗi tìm được: $FAILED_SERVICE"
          echo "FAILED_API=$FAILED_SERVICE" >> $GITHUB_ENV

      # 🚀 TỰ ĐỘNG BẮN LỖI SANG JIRA KÈM TÊN SERVICE (Hiển thị văn bản dạng Rich-Text tinh gọn)
      - name: Auto Log Task to Jira on Failure
        if: ${{ failure() && steps.newman_test.outcome == 'failure' }}
        run: |
          curl --request POST \
            --url "https://${{ secrets.JIRA_DOMAIN }}/rest/api/3/issue" \
            --user "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data '{
              "fields": {
                "project": { "key": "${{ secrets.JIRA_PROJECT_KEY }}" },
                "summary": "Auto-Bug: Postman test failed after deploy",
                "description": {
                  "type": "doc",
                  "version": 1,
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        { "type": "text", "text": "🚨 " },
                        { "type": "text", "text": "HỆ THỐNG PHÁT HIỆN LỖI API TỰ ĐỘNG", "marks": [{ "type": "strong" }] }
                      ]
                    },
                    {
                      "type": "paragraph",
                      "content": [
                        { "type": "text", "text": "Cảnh báo: Tiến trình CI/CD phát hiện API sau đây kiểm thử bị THẤT BẠI: " }
                      ]
                    },
                    {
                      "type": "paragraph",
                      "content": [
                        { "type": "text", "text": "👉 Thành phần lỗi: " },
                        { "type": "text", "text": "${{ env.FAILED_API }}", "marks": [{ "type": "strong" }] }
                      ]
                    },
                    {
                      "type": "paragraph",
                      "content": [
                        { "type": "text", "text": "Vui lòng kiểm tra lại log hệ thống ngay lập tức!" }
                      ]
                    }
                  ]
                },
                "issuetype": { "name": "Task" },
                "assignee": { "id": "${{ secrets.JIRA_ASSIGNEE_ID }}" }
              }
            }'