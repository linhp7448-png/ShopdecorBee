name: CI-CD Automated Workflow

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore HomeDecorShop/HomeDecorShop.sln

      - name: Build
        run: dotnet build HomeDecorShop/HomeDecorShop.sln --configuration Release --no-restore

      - name: Test (.NET Unit/Integration Test)
        run: dotnet test HomeDecorShop/HomeDecorShop.sln --configuration Release --no-build
        continue-on-error: true

      # 🚀 KHỞI CHẠY SERVER API THẬT CHẠY NGẦM
      - name: Start .NET Web API Server
        run: |
          dotnet run --project HomeDecorShop/HomeDecorShop.API/HomeDecorShop.API.csproj --configuration Release --urls "http://localhost:5000" &
          echo "Đang khởi động Server .NET API tại cổng 5000..."
          sleep 12 # Chờ 12 giây để hệ thống Entity Framework/Database khởi tạo xong hoàn toàn

      - name: Setup Node for Newman
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman
        run: npm install -g newman

      # 🎯 CHẠY FILE POSTMAN THẬT ĐỐI CHIẾU VỚI SERVER ĐANG HOẠT ĐỘNG
      - name: Run Postman Automation Test
        run: |
          echo "Hệ thống Newman bắt đầu thực hiện quét toàn bộ 56 API..."
          newman run postman/ShopdecorBee-7-Services.postman_collection.json --env-var "baseUrl=http://localhost:5000"
          
      # Luồng tự động báo lỗi sang Jira kết nối trực tiếp khi kiểm thử thất bại
      - name: Auto Log Task to Jira on Failure
        if: failure()
        run: |
          curl --request POST \
            --url "https://${{ secrets.JIRA_DOMAIN }}/rest/api/3/issue" \
            --user "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data '{
              "fields": {
                "project": { "key": "${{ secrets.JIRA_PROJECT_KEY }}" },
                "summary": "Auto-Bug: Postman test failed after deploy",
                "description": {
                  "type": "doc",
                  "version": 1,
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        { "type": "text", "text": "Pipeline failed at Postman/Newman step. Please check API logs. CC members: " },
                        { "type": "mention", "attrs": { "id": "712020:9e92ab8c-650e-4b0f-8789-8f433994d39d", "text": "@Người 1" } },
                        { "type": "text", "text": " " },
                        { "type": "mention", "attrs": { "id": "712020:4de74e01-956d-46b4-b53b-1bd7cddbbbf1", "text": "@Người 2" } },
                        { "type": "text", "text": " " },
                        { "type": "mention", "attrs": { "id": "712020:67fb1578-f2a4-4442-99c8-4bb7cdc5320e", "text": "@Người 3" } },
                        { "type": "text", "text": " " },
                        { "type": "mention", "attrs": { "id": "712020:9c25dcd2-075c-4b9d-a0c6-b036f52fe668", "text": "@Người 4" } },
                        { "type": "text", "text": " " },
                        { "type": "mention", "attrs": { "id": "712020:d70dcacb-faeb-45d5-8fb1-36e228060915", "text": "@Người 5" } },
                        { "type": "text", "text": " " },
                        { "type": "mention", "attrs": { "id": "712020:0bcf58a4-243d-428c-b5ce-a70c9867de65", "text": "@Người 6" } },
                        { "type": "text", "text": " " },
                        { "type": "mention", "attrs": { "id": "712020:2100b439-5cb7-494f-bb89-b02ef8d8cb1e", "text": "@Người 7" } }
                      ]
                    }
                  ]
                },
                "issuetype": { "name": "Task" },
                "assignee": { "id": "${{ secrets.JIRA_ASSIGNEE_ID }}" }
              }
            }'
