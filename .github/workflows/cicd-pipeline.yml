name: CI-CD Automated Workflow

on:
  push:
    branches: [ "main" ]

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # Đã sửa: Trỏ đúng vào thư mục con chứa file .sln của bạn
      - name: Restore
        run: dotnet restore HomeDecorShop/HomeDecorShop.sln

      # Đã sửa: Build đúng file .sln trong thư mục con
      - name: Build
        run: dotnet build HomeDecorShop/HomeDecorShop.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test HomeDecorShop/HomeDecorShop.sln --configuration Release --no-build
        continue-on-error: true

      # Đã sửa: Cài đặt Node.js để chạy Newman (Bản trước bị ghi nhầm thành setup-dotnet)
      - name: Setup Node for Newman
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Giả lập chạy Postman Test bị lỗi để kích hoạt luồng Jira đúng sơ đồ của thầy
      - name: Run Postman Automation Test
        run: |
          echo "Giả lập: Hệ thống Newman quét API và phát hiện lỗi kết nối!"
          exit 1

      - name: Auto Log Task to Jira on Failure
        if: failure()
        run: |
          curl --request POST \
            --url "https://${{ secrets.JIRA_DOMAIN }}/rest/api/3/issue" \
            --user "${{ secrets.JIRA_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data '{
              "fields": {
                "project": { "key": "${{ secrets.JIRA_PROJECT_KEY }}" },
                "summary": "Auto-Bug: Postman test failed after deploy",
                "description": {
                  "type": "doc",
                  "version": 1,
                  "content": [
                    {
                      "type": "paragraph",
                      "content": [
                        { "type": "text", "text": "Pipeline failed at Postman/Newman step. Please check API logs." }
                      ]
                    }
                  ]
                },
                "issuetype": { "name": "Bug" },
                "assignee": { "id": "${{ secrets.JIRA_ASSIGNEE_ID }}" }
              }
            }'